[pytest]
markers =
    integration: tests that require a built local FAISS index
filterwarnings =
    ignore::urllib3.exceptions.NotOpenSSLWarning
    ignore:The default value of `allowed_objects`.*
    ignore:builtin type SwigPyPacked.*:DeprecationWarning
    ignore:builtin type SwigPyObject.*:DeprecationWarning
    ignore:builtin type swigvarlink.*:DeprecationWarning
